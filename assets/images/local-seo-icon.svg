<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Map background -->
  <rect x="15" y="25" width="70" height="60" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
  
  <!-- Map grid lines -->
  <line x1="35" y1="25" x2="35" y2="85" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="55" y1="25" x2="55" y2="85" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="75" y1="25" x2="75" y2="85" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  
  <line x1="15" y1="45" x2="85" y2="45" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="15" y1="65" x2="85" y2="65" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  
  <!-- Location pin -->
  <!-- Pin circle with heart center -->
  <circle cx="50" cy="48" r="12" fill="none" stroke="currentColor" stroke-width="2.5"/>
  
  <!-- Pin point -->
  <path d="M 50 60 L 56 70 Q 50 78 44 70 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Heart inside pin -->
  <path d="M 47 45 Q 47 43 49 43 Q 50 42 50 43 Q 50 42 51 43 Q 53 43 53 45 Q 53 47 50 49 Q 47 47 47 45" fill="currentColor"/>
</svg>