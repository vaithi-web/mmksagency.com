<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone outline -->
  <rect x="20" y="15" width="60" height="70" rx="5" fill="none" stroke="currentColor" stroke-width="2.5"/>
  
  <!-- Screen -->
  <rect x="25" y="22" width="50" height="55" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Dashboard grid items -->
  <!-- Top left square -->
  <rect x="30" y="27" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Top right square -->
  <rect x="52" y="27" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Middle left rectangle -->
  <rect x="30" y="48" width="18" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Middle right rectangle -->
  <rect x="52" y="48" width="18" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Bottom bar chart -->
  <line x1="30" y1="65" x2="30" y2="70" stroke="currentColor" stroke-width="2"/>
  <line x1="37" y1="62" x2="37" y2="70" stroke="currentColor" stroke-width="2"/>
  <line x1="44" y1="68" x2="44" y2="70" stroke="currentColor" stroke-width="2"/>
  <line x1="51" y1="63" x2="51" y2="70" stroke="currentColor" stroke-width="2"/>
  <line x1="58" y1="66" x2="58" y2="70" stroke="currentColor" stroke-width="2"/>
  <line x1="65" y1="60" x2="65" y2="70" stroke="currentColor" stroke-width="2"/>
  
  <!-- Speaker notch -->
  <rect x="42" y="10" width="16" height="3" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
</svg>