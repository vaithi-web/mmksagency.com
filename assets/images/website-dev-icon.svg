<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Laptop Body -->
  <rect x="15" y="20" width="70" height="45" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/>
  
  <!-- Screen -->
  <rect x="20" y="25" width="60" height="35" fill="none" stroke="currentColor" stroke-width="2"/>
  
  <!-- Code brackets -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <!-- Left bracket -->
    <path d="M 30 35 L 28 40 L 30 45"/>
    <!-- Right bracket -->
    <path d="M 70 35 L 72 40 L 70 45"/>
  </g>
  
  <!-- Code lines -->
  <line x1="35" y1="32" x2="55" y2="32" stroke="currentColor" stroke-width="1.5"/>
  <line x1="35" y1="38" x2="65" y2="38" stroke="currentColor" stroke-width="1.5"/>
  <line x1="35" y1="44" x2="60" y2="44" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Laptop stand -->
  <line x1="35" y1="60" x2="30" y2="70" stroke="currentColor" stroke-width="2.5"/>
  <line x1="65" y1="60" x2="70" y2="70" stroke="currentColor" stroke-width="2.5"/>
  <line x1="30" y1="70" x2="70" y2="70" stroke="currentColor" stroke-width="2.5"/>
</svg>