<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Dashboard background -->
  <rect x="15" y="20" width="70" height="60" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
  
  <!-- Top header bar -->
  <line x1="15" y1="32" x2="85" y2="32" stroke="currentColor" stroke-width="2"/>
  
  <!-- Search box -->
  <rect x="20" y="23" width="35" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Search icon -->
  <circle cx="78" cy="26" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="80" y1="28" x2="82" y2="30" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Analytics chart - Bar graph -->
  <!-- Bar 1 -->
  <line x1="25" y1="60" x2="25" y2="48" stroke="currentColor" stroke-width="3"/>
  <!-- Bar 2 -->
  <line x1="32" y1="60" x2="32" y2="42" stroke="currentColor" stroke-width="3"/>
  <!-- Bar 3 -->
  <line x1="39" y1="60" x2="39" y2="45" stroke="currentColor" stroke-width="3"/>
  
  <!-- Line chart on right -->
  <polyline points="50,55 58,48 66,52 74,42" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Points on line -->
  <circle cx="50" cy="55" r="2" fill="currentColor"/>
  <circle cx="58" cy="48" r="2" fill="currentColor"/>
  <circle cx="66" cy="52" r="2" fill="currentColor"/>
  <circle cx="74" cy="42" r="2" fill="currentColor"/>
  
  <!-- Baseline -->
  <line x1="20" y1="60" x2="80" y2="60" stroke="currentColor" stroke-width="1.5"/>
</svg>