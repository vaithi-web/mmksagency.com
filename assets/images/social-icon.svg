<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
  <!-- Instagram-like square -->
  <rect x="25" y="25" width="50" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <!-- Inner circle (camera lens) -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Dot in corner (flash indicator) -->
  <circle cx="68" cy="32" r="3" fill="currentColor"/>
</svg>